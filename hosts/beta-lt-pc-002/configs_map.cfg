[mkarch.network.hm]
type = static
interface = en*
ip = 192.168.10.5/24
gateway = 192.168.10.1
dns = 1.1.1.1

[mkarch.network.beta]
type = dhcp
interface = en*

[mkarch.packages]
emacs
git
sudo
openssh

[mappings]
$HOME/.emacs.d/early-init.el = $CONFIGS_DIR/progs/emacs/early-init.el
$HOME/.emacs.d/config.org = $CONFIGS_DIR/progs/emacs/config.org
$HOME/.local/bin/configs = $CONFIGS_DIR/scripts/configs
$HOME/.emacs.d/custom.el = $CONFIGS_DIR/progs/emacs/custom.el
$HOME/.emacs.d/config.el = $CONFIGS_DIR/progs/emacs/config.el
