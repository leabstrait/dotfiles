[mkarch.network.hm]
type = static
interface = en*
ip = 192.168.10.5/24
gateway = 192.168.10.1
dns = 1.1.1.1

[mkarch.network.beta]
type = dhcp
interface = en*

[mkarch.packages]
emacs
git
sudo
openssh

[mappings]
$HOME/.emacs.d/early-init.el = $CONFIGS_DIR/progs/emacs/early-init.el
$HOME/.local/bin/configs = $CONFIGS_DIR/scripts/configs
$HOME/.emacs.d/custom.el = $CONFIGS_DIR/progs/emacs/custom.el
$HOME/.emacs.d/init.org = $CONFIGS_DIR/progs/emacs/init.org
$HOME/.emacs.d/init.el = $CONFIGS_DIR/progs/emacs/init.el
$HOME/.bash_profile = $CONFIGS_DIR/progs/bash/.bash_profile
$HOME/.bashrc = $CONFIGS_DIR/progs/bash/.bashrc
$HOME/.gitconfig = $CONFIGS_DIR/progs/git/.gitconfig
$HOME/.ssh/config = $CONFIGS_DIR/progs/ssh/config
$HOME/.local/bin/setup-ws = $CONFIGS_DIR/scripts/setup-ws
$HOME/.psqlrc = $CONFIGS_DIR/progs/psql/.psqlrc
$HOME/.config/starship.toml = $CONFIGS_DIR/progs/starship/starship.toml
$HOME/.config/Code - OSS/User/settings.json = $CONFIGS_DIR/progs/vscode/settings.json
$HOME/.inputrc = $CONFIGS_DIR/progs/readline/.inputrc
$HOME/.config/bat/config = $CONFIGS_DIR/progs/bat/config
$HOME/.config/kglobalshortcutsrc = $CONFIGS_DIR/progs/kde/kglobalshortcutsrc

